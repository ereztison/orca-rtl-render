<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תצוגה מימין לשמאל</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    background: var(--background, #fff);
    color: var(--foreground, #171717);
    font: 14px/1.65 var(--font-sans, system-ui, sans-serif);
  }
  main {
    padding: 12px 16px;
    text-align: start;
    overflow-wrap: anywhere;
    background: var(--card, #fff);
    color: var(--card-foreground, #171717);
    border: 1px solid var(--border, #e4e4e7);
    border-radius: var(--radius, .5rem);
  }
  main > :first-child { margin-block-start: 0; }
  main > :last-child { margin-block-end: 0; }
  h1 { font-size: 1.35em; }
  h2 { font-size: 1.2em; }
  h3, h4, h5, h6 { font-size: 1.05em; }
  :is(h1, h2, h3, h4, h5, h6, p, ul, ol, blockquote, pre, .table-wrap) { margin-block: .65em; }
  ul, ol { padding-inline-start: 1.6em; }
  blockquote {
    margin-inline: 0;
    padding-inline-start: 12px;
    border-inline-start: 3px solid var(--primary, #2563eb);
    color: var(--muted-foreground, #52525b);
  }
  a { color: var(--primary, #1d4ed8); }
  code, pre {
    direction: ltr;
    unicode-bidi: isolate;
    text-align: left;
    font-family: var(--font-mono, ui-monospace, monospace);
    background: var(--muted, #f4f4f5);
    color: var(--foreground, #171717);
    border-radius: 4px;
  }
  code { padding-inline: .25em; }
  pre { padding: 10px 12px; overflow-x: auto; }
  pre code { padding: 0; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    padding: 7px 9px;
    border: 1px solid var(--border, #e4e4e7);
    text-align: start;
  }
  th { background: var(--muted, #f4f4f5); color: var(--foreground, #171717); }
</style>
</head>
<body>
<main>
<!-- CONTENT -->
</main>
</body>
</html>
